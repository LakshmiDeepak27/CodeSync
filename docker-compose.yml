services:
  mysql:
    image: mysql:8.0
    container_name: codesync-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: codesyncpassword
      MYSQL_DATABASE: codesync
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pcodesyncpassword"]
      timeout: 10s
      retries: 5

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: codesync-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: "mysql://root:codesyncpassword@mysql:3306/codesync"
      JWT_SECRET: "codesync-super-secret-jwt-key-for-development-change-in-prod-2026"
      JWT_EXPIRES_IN: "7d"
      CLIENT_URL: "http://localhost:5173"
      SERVER_URL: "http://localhost:5000"
      JUDGE0_BASE_URL: "http://host.docker.internal:2358"
    depends_on:
      mysql:
        condition: service_healthy

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    container_name: codesync-client
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - server

volumes:
  mysql_data:
    driver: local
